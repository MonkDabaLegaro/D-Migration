name: CI

on:
  push:
    branches:
      - main
      - feat/modular-storage-manager
  pull_request:

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore src/DMigration.Cli/DMigration.Cli.csproj
      - name: Build
        run: dotnet build src/DMigration.Cli/DMigration.Cli.csproj --configuration Release --no-restore
      - name: Test
        run: dotnet test tests/DMigration.Tests/DMigration.Tests.csproj --configuration Release
